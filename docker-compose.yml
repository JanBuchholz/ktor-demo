services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      https_proxy: ${https_proxy:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      http_proxy: ${http_proxy:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

  gui:
    build:
      context: ./gui
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "4200:80"
    restart: unless-stopped
